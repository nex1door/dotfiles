# ~/dotfiles/config/picom/picom.conf — «красивый» picom для XFCE 4.20 + NVIDIA (X11)
# Имена опций сверены с официальным picom.sample.conf и man-страницей v13 (picom.app).
# Форки с анимациями (ft-labs, pijulius, compfy) читают picom-animations.conf — там
# старый синтаксис, потому что rules = (...), появившиеся в picom 11+, они не понимают.
# Переключение пикома: Win+P → scripts/picom-toggle.sh
#
# ПОЛИТИКА РАЗМЫТИЯ (белый список):
#   глобально блюра НЕТ. Он включается только для терминалов, верхней панели,
#   уведомлений и меню — там, где это выглядит как «вибрация» macOS.
#   Всё остальное (Telegram, Steam, браузеры, игры, plank, панельные апплеты)
#   блюра не получает: у чужих ARGB-окон блюр вылезает за рамки и выглядит грязно.

#################################  Общее  ######################################
backend = "glx";              # nvidia: glx быстрее; при артефактах поставить "xrender"
vsync = true;                 # монитор 120–165 Гц — без разрывов
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
xrender-sync-fence = true;    # требуется драйверам с explicit sync, в т.ч. nvidia
dithered-present = false;
# unredir-if-possible = true усыплял композитор при полноэкранном окне (любой
# «Media viewer», игра) — эффекты молча пропадали. Держим композитинг включённым,
# а производительность в играх даёт Win+P (picom выключается целиком).
unredir-if-possible = false;
unredir-if-possible-delay = 0;
log-level = "warn";

#################################  Тени  ######################################
shadow = true;
shadow-radius = 28;
shadow-opacity = 0.42;
shadow-offset-x = -18;
shadow-offset-y = -14;
shadow-color = "#000000";
crop-shadow-to-monitor = true;

#################################  Скругления  ################################
corner-radius = 12;

#################################  Размытие  ##################################
blur-method = "dual_kawase";
blur-strength = 4;             # 4 вместо 6: мягче, без «мыла»
blur-background = false;       # ← глобально выключено, включается только правилами ниже
blur-background-frame = false; # ← главная причина «блюра по краям» приложений: под рамками не блюрим
blur-kern = "3x3box";          # нужен только для метода kernel

#################################  Плавность  #################################
fading = true;
fade-in-step = 0.028;
fade-out-step = 0.05;
fade-delta = 8;

################################  Прозрачность  ###############################
frame-opacity = 1.0;          # прозрачность рамок решает тема WhiteSur

#################################  Правила  ###################################
# правила применяются по порядку, для одного и того же ключа побеждает последнее совпадение
rules = (

  # ── фон рабочего стола: это и есть обои, блюрить нечего ──
  { match = "window_type = 'desktop'";
    shadow = false; corner-radius = 0; blur-background = false; },

  # ── верхняя строка xfce4-panel: «вибрация» как у меню-бара macOS ──
  { match = "class_g = 'xfce4-panel' || (window_type = 'dock' && class_g != 'Plank')";
    shadow = false; corner-radius = 0; blur-background = true; },

  # ── Eww / WhiteSur: стеклянная панель и её выпадающие окна ──
  { match = "name = 'Eww - topbar'";
    shadow = false; corner-radius = 13; blur-background = true; },
  { match = "name *= 'Eww - ' && name != 'Eww - topbar'";
    shadow = true; corner-radius = 17; blur-background = true; },

  # ── plank: блюр доки убираем (жалоба: «от plank блюра много») ──
  { match = "class_i = 'plank'";
    shadow = false; corner-radius = 0; blur-background = false; fade = false; },

  # ── панельные апплеты xfce4-panel: это кнопки на панели, им не нужны ни тень, ни скругления ──
  { match = "class_g = 'Wrapper-2.0' || class_g = 'wrapper-2.0'";
    shadow = false; corner-radius = 0; blur-background = false; fade = false; },

  # ── уведомления ──
  { match = "window_type = 'notification'";
    shadow = true; corner-radius = 14; blur-background = true; },

  # ── меню, контекстные и выпадающие списки ──
  { match = "window_type = 'menu' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'combo'";
    corner-radius = 10; blur-background = true; shadow = true; },

  # ── подсказки и drag&drop: ничего лишнего ──
  { match = "window_type = 'tooltip' || window_type = 'dnd'";
    fade = false; shadow = false; blur-background = false; corner-radius = 0; },

  # ── терминалы: прозрачность + блюр позади — единственные окна, где это уместно ──
  { match = "class_g = 'Alacritty' || class_g = 'Xfce4-terminal' || class_g = 'xfce4-terminal' || class_g = 'kitty'";
    opacity = 0.94; blur-background = true; },

  # ── экран блокировки и хранитель экрана ──
  { match = "class_g = 'Xfce4-screensaver' || class_g = 'xfce4-screensaver'";
    shadow = false; corner-radius = 0; blur-background = false; fade = false; },

  # ── ЯВНЫЕ ИСКЛЮЧЕНИЯ: мессенджеры, игры, браузеры, electron, медиа, Wine ──
  #    (блюр у них вылезает по краям — держим выключенным и теней не даём игрушкам)
  { match = "class_g = 'TelegramDesktop' || class_i = 'telegramdesktop' || class_g = 'org.telegram.desktop'";
    blur-background = false; shadow = true; },

  { match = "class_g = 'Steam' || class_g = 'steam' || class_g = 'Steamwebhelper' || class_g = 'steamwebhelper'";
    shadow = false; blur-background = false; fade = false; corner-radius = 0; },

  { match = "class_g = 'Project Zomboid' || class_g = 'wine' || class_g = 'Wine' || class_g = 'lutris' || class_g = 'heroic' || class_g = 'gamescope'";
    shadow = false; blur-background = false; fade = false; corner-radius = 0; },

  { match = "class_g = 'firefox' || class_g = 'Navigator' || class_g = 'firefox-esr' || class_g = 'chromium' || class_g = 'Chromium' || class_g = 'brave-browser' || class_g = 'google-chrome' || class_g = 'Brave-browser'";
    blur-background = false; },

  { match = "class_g = 'code' || class_g = 'code-oss' || class_g = 'codium' || class_g = 'discord' || class_g = 'Discord' || class_g = 'slack' || class_g = 'Slack' || class_g = 'Element' || class_g = 'signal' || class_g = 'Signal' || class_g = 'qBittorrent' || class_g = 'keepassxc' || class_g = 'KeePassXC' || class_g = 'virt-manager' || class_g = 'Virt-manager'";
    blur-background = false; },

  { match = "class_g = 'mpv' || class_g = 'vlc' || class_g = 'Vlc' || class_g = 'obs' || class_g = 'obs-studio' || class_g = 'gimp' || class_g = 'Gimp' || class_g = 'krita' || class_g = 'libreoffice' || class_g = 'soffice' || class_g = 'Audacity' || class_g = 'audacity'";
    blur-background = false; },

  { match = "class_g = 'thunar' || class_g = 'Thunar' || class_g = 'xfdesktop' || class_g = 'Xfdesktop' || class_g = 'ristretto' || class_g = 'parole' || class_g = 'mousepad' || class_g = 'galculator' || class_g = 'pavucontrol' || class_g = 'xfce4-appfinder' || class_g = 'xfce4-taskmanager' || class_g = 'xfce4-terminal-settings'";
    blur-background = false; },

  # ── последнее слово: полноэкранные окна без скруглений, теней, блюра и затухания ──
  { match = "fullscreen";
    corner-radius = 0; shadow = false; blur-background = false; fade = false; }
)
