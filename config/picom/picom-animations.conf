# ~/dotfiles/config/picom/picom-animations.conf — вариант для ФОРКОВ picom с анимациями
# (ft-labs/picom, pijulius/picom, compfy, arian8j2 и др.).
# Форки основаны на picom 11 и понимают «старый» синтаксис
# (shadow-exclude / blur-background-exclude / opacity-rule / fade-exclude / wintypes),
# но НЕ понимают новый rules = (...). Поэтому файл самодостаточный, без @include.
# Обычный picom v13 эти ключи тоже примет, а вот animations он не знает — поэтому
# файл применяется только к форкам (выбор автоматический, см. picom-toggle.sh).
#
# ПОЛИТИКА РАЗМЫТИЯ здесь та же, что в picom.conf: блюр только терминалам, панели,
# меню и уведомлениям. Реализована через белый список с отрицанием + явные исключения.

#################################  Анимации  ##################################
# Эффекты: fly-in, maximize, minimize, slide-in-center, slide-out-center, slide-left,
# slide-right, slide-up, slide-down, squeeze, squeeze-bottom, zoom
animations = true;
animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";
animation-for-transient-window = "slide-up";
animation-stiffness-in-tag = 140;
animation-stiffness-tag-change = 120;
animation-window-mass = 0.5;
animation-dampening = 18;
animation-clamping = true;

#################################  Общее  #####################################
backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
xrender-sync-fence = true;
# эффекты держим всегда включёнными (см. комментарий в picom.conf), в играх — Win+P
unredir-if-possible = false;
unredir-if-possible-delay = 0;
log-level = "warn";

#################################  Тени  ######################################
shadow = true;
shadow-radius = 28;
shadow-opacity = 0.42;
shadow-offset-x = -18;
shadow-offset-y = -14;
shadow-color = "#000000";
crop-shadow-to-monitor = true;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "class_g = 'Plank' || class_i = 'plank'",
  "class_g = 'Wrapper-2.0' || class_g = 'wrapper-2.0'",
  "class_g = 'Xfce4-screensaver'",
  "class_g = 'Steam' || class_g = 'steamwebhelper'",
  "class_g = 'Project Zomboid' || class_g = 'wine' || class_g = 'Wine'",
  "class_g = 'lutris' || class_g = 'heroic' || class_g = 'gamescope'",
  "fullscreen"
];

#################################  Скругления  ################################
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "class_g = 'Plank' || class_i = 'plank'",
  "class_g = 'Wrapper-2.0' || class_g = 'wrapper-2.0'",
  "class_g = 'Xfce4-screensaver'",
  "class_g = 'Steam' || class_g = 'steamwebhelper'",
  "class_g = 'Project Zomboid' || class_g = 'wine' || class_g = 'Wine'",
  "class_g = 'lutris' || class_g = 'heroic' || class_g = 'gamescope'",
  "fullscreen"
];

#################################  Размытие  ##################################
blur-method = "dual_kawase";
blur-strength = 4;
blur-background = true;
blur-background-frame = false;   # ← под рамками не блюрим: это и давало «грязные края»
blur-kern = "3x3box";
blur-background-exclude = [
  "window_type = 'tooltip'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@",

  # белый список: блюрим ТОЛЬКО терминалы, панель, меню и уведомления
  "!(class_g = 'Alacritty' || class_g = 'Xfce4-terminal' || class_g = 'xfce4-terminal' || class_g = 'kitty' || class_g = 'xfce4-panel' || window_type = 'dock' || window_type = 'menu' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'combo' || window_type = 'notification')",

  # явные нарушители (у них блюр вылезал по краям)
  "class_g = 'Plank' || class_i = 'plank'",
  "class_g = 'Wrapper-2.0' || class_g = 'wrapper-2.0'",
  "class_g = 'Xfce4-screensaver'",
  "class_g = 'TelegramDesktop' || class_i = 'telegramdesktop'",
  "class_g = 'Steam' || class_g = 'steamwebhelper'",
  "class_g = 'Project Zomboid' || class_g = 'wine' || class_g = 'Wine'",
  "class_g = 'lutris' || class_g = 'heroic' || class_g = 'gamescope'",
  "class_g = 'firefox' || class_g = 'Navigator' || class_g = 'chromium' || class_g = 'brave-browser' || class_g = 'google-chrome'",
  "class_g = 'code' || class_g = 'codium' || class_g = 'discord' || class_g = 'slack' || class_g = 'Element' || class_g = 'signal' || class_g = 'qBittorrent' || class_g = 'keepassxc' || class_g = 'virt-manager'",
  "class_g = 'mpv' || class_g = 'vlc' || class_g = 'obs' || class_g = 'obs-studio' || class_g = 'gimp' || class_g = 'krita' || class_g = 'libreoffice' || class_g = 'soffice' || class_g = 'Audacity'",
  "class_g = 'thunar' || class_g = 'xfdesktop' || class_g = 'ristretto' || class_g = 'parole' || class_g = 'mousepad' || class_g = 'galculator' || class_g = 'pavucontrol'",
  "fullscreen"
];

################################  Прозрачность  ###############################
frame-opacity = 1.0;
opacity-rule = [
  "94:class_g = 'Alacritty'",
  "94:class_g = 'Xfce4-terminal'",
  "94:class_g = 'xfce4-terminal'",
  "94:class_g = 'kitty'"
];

#################################  Плавность  #################################
fading = true;
fade-in-step = 0.028;
fade-out-step = 0.05;
fade-delta = 8;
fade-exclude = [
  "window_type = 'tooltip'",
  "class_g = 'Plank' || class_i = 'plank'",
  "class_g = 'Wrapper-2.0' || class_g = 'wrapper-2.0'",
  "class_g = 'Xfce4-screensaver'",
  "class_g = 'Steam' || class_g = 'steamwebhelper'",
  "class_g = 'Project Zomboid' || class_g = 'wine' || class_g = 'Wine'",
  "fullscreen"
];

#################################  Типы окон  #################################
wintypes:
{
  tooltip       = { fade = false; shadow = false; opacity = 0.85; blur-background = false; };
  dock          = { shadow = false; corner-radius = 0; blur-background = true; };
  desktop       = { shadow = false; corner-radius = 0; blur-background = false; };
  dnd           = { fade = false; shadow = false; opacity = 0.85; blur-background = false; };
  menu          = { corner-radius = 10; blur-background = true; shadow = true; };
  popup_menu    = { corner-radius = 10; blur-background = true; shadow = true; };
  dropdown_menu = { corner-radius = 10; blur-background = true; shadow = true; };
  combo         = { corner-radius = 10; blur-background = true; shadow = true; };
  notification  = { corner-radius = 14; blur-background = true; shadow = true; };
}